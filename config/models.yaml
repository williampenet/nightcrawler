# Task -> model routing (CLAUDE.md, LLM policy). Business code calls tasks, never models.
# No API keys here: keys come from env vars (CI / host secrets).

tasks:
  extract_events:
    adr: docs/adr/0004-model-selection-extract-events.md
    # ADR-0004 (accepted 2026-10-07): routed; called by the page_llm reader (WIP-66).
    # Same request as eval candidate `gemma-4-26b-a4b-scaleway` (eval/models.yaml), run 3 F1 1.0.
    primary:
      provider: scaleway              # Generative APIs, Paris; key SCW_GENAI_SECRET_KEY
      model: gemma-4-26b-a4b-it       # served as google/gemma-4-26b-a4b-it:bf16 (supported-models page)
      extra:
        reasoning_effort: none        # thinking off: thinking tokens are billed as output
    # No fallback: Gemma's output was schema-valid on 7/7 pages (ADR-0004, Escalation).
    temperature: 0.0
    # Gate in the Model eval workflow (eval/__main__.py, push to main + weekly `--only routed`):
    # the candidate with the same provider, model and extra must be measured, reach this F1 and
    # leak 0 injected events, else the run fails.
    min_quality: 0.85
    limits:
      max_output_tokens: 2048
      # Shared with every candidate by the eval runner: kept at 10 min for the local CPU ones.
      timeout_ms: 600000
      # Upper bound on one model call's page text. The page_llm reader (WIP-66) splits long
      # pages into chunks of llm_chunk_chars (3,200, config/zone.yaml) so every call stays
      # within the evaluated input size (eval pages <= 3,234 chars).
      max_input_chars: 7000

  judge_taste:
    adr: docs/adr/0006-model-selection-judge-taste.md
    # ADR-0006 (accepted 2026-10-09, William): recall first. Same request as eval candidate
    # `mistral-small-3.2-scaleway` (eval/judge/models.yaml), condition `nn` (nearest ratings).
    # The prompt holds personal data (written taste, ratings): EU host only (Scaleway, Paris).
    primary:
      provider: scaleway              # Generative APIs, Paris; key SCW_GENAI_SECRET_KEY
      model: mistral-small-3.2-24b-instruct-2506   # served as mistral/...:fp8 (supported models)
    # No fallback: schema-valid on 100 % of answers in runs 2–5 (ADR-0006).
    temperature: 0.0
    # Gate in the Judge eval workflow (eval/judge/__main__.py): in condition `nn`, the share of
    # William's positives that judge.section() shows on the home page must reach this.
    min_quality: 0.85
    limits:
      max_output_tokens: 400
      timeout_ms: 120000
