# The area Nightcrawler watches. Change these values to run it for another city.
name: Lyon metropolitan area
latitude: 45.7578   # Place Bellecour
longitude: 4.8320
radius_km: 15
timezone: Europe/Paris
window_days: 60     # how far ahead concerts are collected
# Regional OpenStreetMap extract covering the zone (download.geofabrik.de), refreshed weekly in CI
osm_extract_url: https://download.geofabrik.de/europe/france/rhone-alpes-latest.osm.pbf
# Gancio community agendas (open-source federated event calendars) covering the zone
gancio_instances:
  - name: Ville Morte
    url: https://agenda.villemorte.fr
# Venues dropped from every source (OSM, Ticketmaster, Gancio, venue and platform pages).
# A venue is dropped when its normalised name equals an entry (case, accents, hyphens and
# le/la/salle... ignored); an event is dropped when its location contains an entry's words.
# Asked by William on 2026-10-06 (WIP-51).
excluded_venues:
  - Radiant Bellevue
  - Toï Toï le Zinc
# "Mes salles" (PRD FR-1) read through a configured reader, on top of the automatic probe.
# `venue` is the known venue (OpenStreetMap / Ticketmaster name) the events are attached to.
# wp_json: a WordPress REST endpoint; field paths are dotted keys of one item (WIP-60).
# listing_jsonld: listing page(s) -> event links on the same host whose path matches `include`
# and not `exclude` -> schema.org Event JSON-LD of each detail page, at most `max_details`
# pages; `{yyyymm}` in a URL is read for every month of the run window (WIP-62).
# `paginate: {param, start, max}` also reads param=start, start+1... (at most `max` more pages
# per URL) until a page brings no new link (WIP-64).
# Optional per venue (WIP-64): `category` (e.g. music_venue: its events pass the venue-based
# concert rule) and `latitude`/`longitude`. `venue` is matched against known venues as
# events are attributed (words in a row, closest name first). A match keeps its category
# and coordinates unless `category` is set; with no match, a configured venue is created
# (venues.configured_venues; default category events_venue, the same concert rule as no
# venue), with the configured coordinates or those of the venue `coordinates_from` names.
# `venue_id` (optional) attaches the events to that venue id directly, no name matching;
# if the run does not know it, the name is used and the status row says so.
# page_llm (WIP-66): no structured data; the page text of `urls` (and `paginate` pages) goes
# to the extract_events task (config/models.yaml). `attach: by_location` = an aggregator:
# events go to the place written on the page, not to `venue` (needs a location field in the
# extraction schema: skipped until then). Hosts' robots.txt Crawl-delay is honoured.
# Structures checked on 2026-10-07 (server HTML, no JavaScript).
llm_pages_per_run: 40  # pages sent to the model per run, all page_llm venues together
priority_venues:
  - name: Le Transbordeur
    venue: Le Transbordeur
    reader:
      type: wp_json
      # checked 2026-10-06: acf.date "20270520", acf.hour "18:30:00"; 97 items, page 21
      # at per_page=5 answers HTTP 400; robots.txt allows all
      url: https://www.transbordeur.fr/wp-json/wp/v2/evenement
      fields:
        title: title.rendered
        date: acf.date
        time: acf.hour
        ticket: acf.bouton_booking.url
        link: link
      date_format: "%Y%m%d"
      time_format: "%H:%M:%S"
      per_page: 50
      max_pages: 5
  - name: Opéra Underground
    # no OSM venue of that name (run of 2026-10-07 08:10): a configured music venue, so its
    # concerts are not left to the keyword rule. It plays in the Opéra building (the JSON-LD
    # location is always "Opéra de Lyon"): same coordinates as the OSM "Opéra de Lyon", so
    # the same show listed there (Ticketmaster...) merges within dedup's 300 m.
    venue: Opéra Underground
    category: music_venue
    coordinates_from: Opéra de Lyon
    reader:
      type: listing_jsonld
      # 11-12 links per page; detail JSON-LD is an array, one http://schema.org/Event per
      # performance. Server-side pages: &page=2 brings 13 new links (&p=2 and &offset=12
      # serve page 1 again; measured 2026-10-07). The season is in the URL: update it yearly.
      urls:
        - https://www.opera-lyon.com/programmation-reservations/saison-2026-2027?tag%5B0%5D=opera-underground
      include: ^/fr/programmation/[^/]+/opera-underground/[^/]+$
      paginate: {param: page, start: 2, max: 5}
      max_details: 60
  - name: L'Épicerie Moderne
    venue: L'Épicerie Moderne
    # the run knows this place twice: OSM "L'épicerie moderne Place René Lescot, 69320
    # Feyzin" (concert_hall, lat 45.6747674) and Gancio "L’Épicerie Moderne" (lat 45.673384,
    # >150 m apart: not merged). Live venues.json of 2026-10-07 08:38.
    venue_id: osm:node/523776298
    reader:
      type: listing_jsonld
      # 24 links on /agenda, "Afficher plus" = ?page=1 (pages count from 0); one Event object
      # per detail page. "...scolaire" slugs are school sessions, not open to the public.
      urls: [https://epiceriemoderne.com/agenda]
      paginate: {param: page, start: 1, max: 3}
      include: ^/agenda/20\d\d-\d\d-\d\d-
      exclude: scolaire
      max_details: 60
  - name: Le Marché Gare
    venue: Le Marché Gare
    reader:
      type: listing_jsonld
      # bare domain: www.marchegare.fr has a TLS name mismatch. 25 links, one Event per page;
      # workshops are listed too and left to the concert filter. "Afficher plus" links to
      # ?page=1 (seen through WebFetch on 2026-10-07; whether it holds new links: unverified).
      urls: [https://marchegare.fr/agenda]
      paginate: {param: page, start: 1, max: 3}
      include: ^/agenda/[a-z0-9-]+$
      max_details: 60
  - name: Auditorium de Lyon
    venue: Auditorium Maurice-Ravel  # OSM name (osm:way/62336964)
    reader:
      type: listing_jsonld
      # one listing per month (202611: 26 links); detail JSON-LD in @graph, startDate without
      # offset (read in the zone's timezone). Category is the 2nd path segment: school
      # sessions (scolaires) and workshops (atelier-*) are not public concerts and are
      # dropped; family concerts (famille) are public concerts and are kept.
      urls: ["https://www.auditorium-lyon.com/fr/agenda/{yyyymm}"]
      include: ^/fr/saison-\d{4}-\d{2}/[a-z-]+/[^/]+$
      exclude: ^/fr/saison-\d{4}-\d{2}/(scolaires|atelier-[a-z-]+)/
      max_details: 80
  # page_llm venues: URLs answered WebFetch on 2026-10-07; robots.txt read the same day.
  - name: La Rayonne
    venue: La Rayonne
    venue_id: osm:node/11268760933  # live concerts.json, 2026-10-07
    reader:
      type: page_llm
      # ~70 events on one page, "jeu. 08 octobre - à partir de 19h - Didier Super Metal" (no
      # year); concerts mixed with workshops. robots.txt: `User-agent: *`, `Crawl-delay: 10`.
      # Bare domain: www.larayonne.org has a TLS name mismatch (WIP-56).
      urls: [https://larayonne.org/agenda/]
  - name: Le Périscope
    # WP REST types `kelkii_concert` / `periscope_event` carry no event date field
    # (checked 2026-10-06), so the concerts page is read by the model.
    venue: Le Périscope
    venue_id: osm:node/6875303994  # live concerts.json, 2026-10-07
    reader:
      type: page_llm
      # 21 items, "Louis Sclavis Shunkan Trio Mercredi 07 oct" (no year), no pagination.
      # robots.txt: `User-agent: *`, empty Disallow (all allowed).
      urls: [https://www.periscope-lyon.com/concerts/]
  - name: Chapelle de la Trinité
    # no known venue of that name in the run (live venues.json read up to "F"): a configured
    # venue without coordinates (unverified: no sourced coordinates found)
    venue: Chapelle de la Trinité
    reader:
      type: page_llm
      # Mapado ticketing page, 30 events with year, "Jeu. 12 nov. 2026 à 20:00"; concerts
      # mixed with talks and guided tours. robots.txt disallows /api/ (not used) and payment
      # paths; the listing is allowed.
      urls: [https://trinitelyon.mapado.com/]
  - name: Les Subsistances
    venue: Les Subsistances
    # fr.wikipedia.org/wiki/Les_Subsistances (Géoportail link): 8 bis quai Saint-Vincent
    latitude: 45.768234
    longitude: 4.816856
    reader:
      type: page_llm
      # "29 résultats", mostly dance and theatre, a few DJ sets. robots.txt disallows only
      # /wp-admin/.
      urls: [https://www.les-subs.com/agenda/]
  - name: Petit Bulletin
    # aggregator: 518 results, ~20 per page, "Page 1 sur 26"; each item gives title,
    # category, place and full date. `?p=2` is page 2 (checked 2026-10-07). robots.txt:
    # `*` disallows /newsletter/, /images/, /admin/...; ClaudeBot, GPTBot, CCBot are fully
    # disallowed, NightcrawlerBot is not named. Skipped until the schema has a location field.
    venue: Petit Bulletin
    reader:
      type: page_llm
      attach: by_location
      urls: [https://www.petit-bulletin.fr/agenda-recherche.html]
      # page 1 starts on 6 Oct, page 2 on 8 Oct: how many days 10 pages cover is unverified
      paginate: {param: p, start: 2, max: 9}
