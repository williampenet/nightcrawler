# The area Nightcrawler watches. Change these values to run it for another city.
name: Lyon metropolitan area
latitude: 45.7578   # Place Bellecour
longitude: 4.8320
radius_km: 15
timezone: Europe/Paris
window_days: 60     # how far ahead concerts are collected
# Regional OpenStreetMap extract covering the zone (download.geofabrik.de), refreshed weekly in CI
osm_extract_url: https://download.geofabrik.de/europe/france/rhone-alpes-latest.osm.pbf
# Gancio community agendas (open-source federated event calendars) covering the zone
gancio_instances:
  - name: Ville Morte
    url: https://agenda.villemorte.fr
# Venues dropped from every source (OSM, Ticketmaster, Gancio, venue and platform pages).
# A venue is dropped when its normalised name equals an entry (case, accents, hyphens and
# le/la/salle... ignored); an event is dropped when its location contains an entry's words.
# Asked by William on 2026-10-06 (WIP-51).
excluded_venues:
  - Radiant Bellevue
  - Toï Toï le Zinc
# "Mes salles" (PRD FR-1) read through a configured reader, on top of the automatic probe.
# `venue` is the known venue (OpenStreetMap / Ticketmaster name) the events are attached to.
# wp_json: a WordPress REST endpoint; field paths are dotted keys of one item (WIP-60).
# listing_jsonld: listing page(s) -> event links on the same host whose path matches `include`
# and not `exclude` -> schema.org Event JSON-LD of each detail page, at most `max_details`
# pages; `{yyyymm}` in a URL is read for every month of the run window (WIP-62).
# `paginate: {param, start, max}` also reads param=start, start+1... (at most `max` more pages
# per URL) until a page brings no new link (WIP-64).
# Optional per venue (WIP-64): `category` (e.g. music_venue: its events pass the venue-based
# concert rule) and `latitude`/`longitude`. A known venue with the same name takes the
# category; without one, a configured venue is created (venues.configured_venues), with
# the configured coordinates or those of the known venue named in `coordinates_from`.
# Structures checked on 2026-10-07 (server HTML, no JavaScript).
priority_venues:
  - name: Le Transbordeur
    venue: Le Transbordeur
    reader:
      type: wp_json
      # checked 2026-10-06: acf.date "20270520", acf.hour "18:30:00"; 97 items, page 21
      # at per_page=5 answers HTTP 400; robots.txt allows all
      url: https://www.transbordeur.fr/wp-json/wp/v2/evenement
      fields:
        title: title.rendered
        date: acf.date
        time: acf.hour
        ticket: acf.bouton_booking.url
        link: link
      date_format: "%Y%m%d"
      time_format: "%H:%M:%S"
      per_page: 50
      max_pages: 5
  - name: Opéra Underground
    # no OSM venue of that name (run of 2026-10-07 08:10): a configured music venue, so its
    # concerts are not left to the keyword rule. It plays in the Opéra building (the JSON-LD
    # location is always "Opéra de Lyon"): same coordinates as the OSM "Opéra de Lyon", so
    # the same show listed there (Ticketmaster...) merges within dedup's 300 m.
    venue: Opéra Underground
    category: music_venue
    coordinates_from: Opéra de Lyon
    reader:
      type: listing_jsonld
      # 11-12 links per page; detail JSON-LD is an array, one http://schema.org/Event per
      # performance. Server-side pages: &page=2 brings 13 new links (&p=2 and &offset=12
      # serve page 1 again; measured 2026-10-07). The season is in the URL: update it yearly.
      urls:
        - https://www.opera-lyon.com/programmation-reservations/saison-2026-2027?tag%5B0%5D=opera-underground
      include: ^/fr/programmation/[^/]+/opera-underground/[^/]+$
      paginate: {param: page, start: 2, max: 5}
      max_details: 60
  - name: L'Épicerie Moderne
    venue: L'Épicerie Moderne
    reader:
      type: listing_jsonld
      # 24 links on /agenda, "Afficher plus" = ?page=1 (pages count from 0); one Event object
      # per detail page. "...scolaire" slugs are school sessions, not open to the public.
      urls: [https://epiceriemoderne.com/agenda]
      paginate: {param: page, start: 1, max: 3}
      include: ^/agenda/20\d\d-\d\d-\d\d-
      exclude: scolaire
      max_details: 60
  - name: Le Marché Gare
    venue: Le Marché Gare
    reader:
      type: listing_jsonld
      # bare domain: www.marchegare.fr has a TLS name mismatch. 25 links, one Event per page;
      # workshops are listed too and left to the concert filter. "Afficher plus" links to
      # ?page=1 (seen through WebFetch on 2026-10-07; whether it holds new links: unverified).
      urls: [https://marchegare.fr/agenda]
      paginate: {param: page, start: 1, max: 3}
      include: ^/agenda/[a-z0-9-]+$
      max_details: 60
  - name: Auditorium de Lyon
    venue: Auditorium Maurice-Ravel  # OSM name (osm:way/62336964)
    reader:
      type: listing_jsonld
      # one listing per month (202611: 26 links); detail JSON-LD in @graph, startDate without
      # offset (read in the zone's timezone). Category is the 2nd path segment: school
      # sessions (scolaires) and workshops (atelier-*) are not public concerts and are
      # dropped; family concerts (famille) are public concerts and are kept.
      urls: ["https://www.auditorium-lyon.com/fr/agenda/{yyyymm}"]
      include: ^/fr/saison-\d{4}-\d{2}/[a-z-]+/[^/]+$
      exclude: ^/fr/saison-\d{4}-\d{2}/(scolaires|atelier-[a-z-]+)/
      max_details: 80
  # Le Périscope: not added. Its WP REST types `kelkii_concert` and `periscope_event`
  # ("Cafés culturels") carry no event date field, only the publication date and dates in
  # free text (checked 2026-10-06: /wp-json/wp/v2/types, /wp-json/wp/v2/periscope_event).
