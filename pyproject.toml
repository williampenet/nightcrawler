[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nightcrawler"
version = "0.1.0"
description = "Finds concerts near you that match your taste."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "icalendar>=6,<8",
    "python-dateutil>=2.9,<3",
    "pyyaml>=6,<7",
    "psycopg[binary]>=3.2,<3.4",  # event store (ADR-0005)
    # event pages' main text (WIP-92); Apache-2.0 since 1.8.0 (earlier versions were GPL)
    "trafilatura==2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
nightcrawler = "nightcrawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nightcrawler = ["web/*", "store/sql/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the eval package lives at the repo root
