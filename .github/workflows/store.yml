name: Event store

# Creates the Scaleway Serverless SQL Database once and applies schema migrations (ADR-0005).
on:
  push:
    branches: [main]
    paths: [src/nightcrawler/store/**, .github/workflows/store.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: event-store
  cancel-in-progress: false

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .
      - name: Ensure database and migrate
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
        run: python -m nightcrawler store
