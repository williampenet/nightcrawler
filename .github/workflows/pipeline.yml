name: Pipeline

# Collects venues and concerts, then publishes the static page to GitHub Pages.
on:
  schedule:
    - cron: "17 4 * * *"  # daily, 04:17 UTC (06:17 Paris in summer, 05:17 in winter)
  workflow_dispatch:
  push:  # continuous deployment of main
    branches: [main]
    paths: ["src/**", "config/**", "pyproject.toml", ".github/workflows/pipeline.yml"]

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      # Reuse yesterday's HTTP cache so venue sites are not hit twice within 20 hours.
      - uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      - name: Run the pipeline
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m nightcrawler run --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    # only the deploy job may publish; the scraping job stays read-only
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
