name: Pipeline

# Collects venues and concerts, then publishes the static page to GitHub Pages.
on:
  schedule:
    - cron: "17 4 * * *"  # daily, 04:17 UTC (06:17 Paris in summer, 05:17 in winter)
  workflow_dispatch:
  push:  # continuous deployment of main
    branches: [main]
    paths: ["src/**", "config/**", "eval/reference/**", "pyproject.toml", ".github/workflows/pipeline.yml"]

permissions:
  contents: read

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .

      # Venues from a regional OpenStreetMap extract, rebuilt once a week
      # (Overpass rejects CI runners with HTTP 406; ADR-0001 / WIP-19).
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - id: osm-cache
        uses: actions/cache@v4
        with:
          path: .cache/osm
          key: osm-${{ hashFiles('config/zone.yaml', 'src/nightcrawler/sources/osm.py') }}-${{ steps.week.outputs.week }}
      - name: Build the OSM venue extract
        if: steps.osm-cache.outputs.cache-hit != 'true'
        continue-on-error: true  # the pipeline falls back to Overpass
        run: |
          eval "$(python -m nightcrawler osm-extract-plan)"
          [ -n "$OSM_URL" ] || { echo "::notice::No osm_extract_url in zone config"; exit 0; }
          sudo apt-get install -y -qq osmium-tool > /dev/null
          mkdir -p /tmp/osm
          curl -fsSL --retry 3 -A "NightcrawlerBot/0.1 (+https://github.com/williampenet/nightcrawler)" \
            -o /tmp/osm/region.osm.pbf "$OSM_URL"
          osmium extract -b "$OSM_BBOX" /tmp/osm/region.osm.pbf -o /tmp/osm/zone.osm.pbf
          osmium tags-filter /tmp/osm/zone.osm.pbf $OSM_FILTERS -o /tmp/osm/venues.osm.pbf
          mkdir -p .cache/osm  # only now, so a failed build never caches an empty folder
          osmium export /tmp/osm/venues.osm.pbf -f geojsonseq --add-unique-id=type_id \
            -o .cache/osm/venues.geojsonseq
          echo "::notice::OSM extract built: $(wc -l < .cache/osm/venues.geojsonseq) features"

      # Reuse yesterday's HTTP cache so venue sites are not hit twice within 20 hours.
      - uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      # --store (ADR-0005, WIP-46): the database URL is built and used inside this step
      # only, never exported to later steps; without the secrets or if the store fails,
      # the run goes on stateless with a notice / warning annotation.
      - name: Run the pipeline
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DB_USER: ${{ secrets.SCW_DB_USER }}  # optional
        run: python -m nightcrawler run --out site --store

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    # only the deploy job may publish; the scraping job stays read-only
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
