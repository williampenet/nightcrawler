name: Model eval

# Runs every candidate of eval/models.yaml, local ones on CPU with llama.cpp (no GPU, €0).
# Results: job summary + annotations (docs/MODEL_EVAL.md is updated from them).
# Not on pull requests: a run holds a runner for ~40 min and starved the PR checks.
on:
  push:
    branches: [main]
    # eval/judge/** is the judge_taste eval (workflow judge.yml): it must not start this one
    paths: [eval/**, '!eval/judge/**', config/models.yaml, src/nightcrawler/llm.py,
            src/nightcrawler/extract.py, .github/workflows/eval.yml]
  # Weekly check of the routed model only (`--only routed`), so a provider-side change to a hosted
  # model shows up as a failed gate (ADR-0004). ~11 k tokens on Scaleway per run (run 3: 7 pages x
  # 964 in / 585 out), < €0.01 at €0.25 / €0.50 per M tokens. Mondays 05:17 UTC.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      only:
        description: 'Candidate ids, comma-separated (empty = all), e.g. the Scaleway ones only'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: model-eval-${{ github.ref }}
  cancel-in-progress: false  # a run is long (CPU inference): queue new ones, never kill one

env:
  LLAMA_CPP_TAG: b11425
  # SHA-256 of llama-b11425-bin-ubuntu-x64.tar.gz (recorded by the first run, 2026-10-05)
  LLAMA_CPP_SHA256: 6a47856d08ecc4030b2fa8b8bf761c96d142d689567f69a0f75e42de430dc34c

jobs:
  eval:
    runs-on: ubuntu-latest
    # 240: run 3 took ~2 h; the local Gemma 26B-A4B QAT candidate (14.4 GB, up to 10 min per
    # page) can add ~70 min. GitHub-hosted jobs allow 360; public repo, so no minute cost.
    timeout-minutes: 240
    env:
      MODEL_CACHE: .cache/models
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e .

      - name: Cache llama.cpp
        id: llama-cache
        uses: actions/cache@v4
        with:
          path: .cache/llama
          key: llama-${{ env.LLAMA_CPP_TAG }}-ubuntu-x64-v2
      - name: Download llama.cpp (official release)
        if: steps.llama-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/llama && cd .cache/llama
          gh release download "$LLAMA_CPP_TAG" -R ggml-org/llama.cpp -p "llama-$LLAMA_CPP_TAG-bin-ubuntu-x64.*"
          for f in llama-*; do
            sum=$(sha256sum "$f" | cut -d' ' -f1)
            if [ -n "$LLAMA_CPP_SHA256" ]; then
              [ "$sum" = "$LLAMA_CPP_SHA256" ] || { echo "::error::$f SHA-256 mismatch"; exit 1; }
            else
              echo "::notice::pin LLAMA_CPP_SHA256 for $f: $sum"
            fi
            case "$f" in
              *.zip) unzip -q "$f" ;;
              *.tar.gz) tar xzf "$f" ;;
            esac
            rm -f "$f"
          done
      - name: Locate llama-server
        run: |
          bin=$(find "$PWD/.cache/llama" -type f -name llama-server | head -1)
          test -n "$bin" || { echo "::error::llama-server not found in the release"; exit 1; }
          chmod +x "$bin"
          echo "LLAMA_SERVER=$bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$bin")" >> "$GITHUB_ENV"
          echo "::notice::llama.cpp $LLAMA_CPP_TAG, $(nproc) CPUs, $(free -g | awk '/Mem/{print $2}') GB RAM, $(df -BG --output=avail . | tail -1 | tr -d ' ') free disk"

      - name: Cache model weights (SHA-256 verified on use)
        if: github.event_name != 'schedule'  # the weekly run calls the hosted routed model only
        uses: actions/cache@v4
        with:
          path: .cache/models
          key: models-${{ hashFiles('eval/models.yaml') }}
          restore-keys: models-

      - name: Run the eval
        env:
          # only this step sees the keys; hosted candidates without a key are "skipped: no key"
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # Scaleway IAM application limited to GenerativeApisModelAccess (README)
          SCW_GENAI_SECRET_KEY: ${{ secrets.SCW_GENAI_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          # schedule: the routed candidate only; dispatch: the input; push: empty = all
          ONLY: ${{ github.event_name == 'schedule' && 'routed' || inputs.only }}
        run: python -m eval --only "$ONLY"
