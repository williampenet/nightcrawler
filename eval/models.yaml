    price_eur_per_mtok: {in: 0.1, out: 0.3}   # list price is USD 0.1 / 0.3; ~EUR at par
    retired: true
    note: >-
      retired — deprecated, retirement date 2026-04-30
      (https://docs.mistral.ai/models/model-cards/mistral-small-3-2-25-06); same weights
      evaluated on Scaleway (mistral-small-3.2-scaleway)

  - id: reference-gold-claude-opus
