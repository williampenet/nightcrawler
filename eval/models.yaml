# Candidates compared per task (same fields as config/models.yaml, plus documentation fields).
# Local candidates run only where LLAMA_SERVER points to a llama.cpp `llama-server` binary
# (the Model eval workflow); hosted ones only when their API key is set ("skipped: no key"
# otherwise). `retired: true` keeps a row for the record without calling it. Hosted candidates
# run first. A local model is skipped ("disk") when free disk < size_bytes + 2 GB margin;
# `cache: false` keeps its weights out of the cached .cache/models folder.

extract_events:
  - id: ministral-3-3b-q4
    publisher: Mistral AI (FR)
    licence: Apache-2.0
    params: 3.4B + 0.4B vision encoder (unused)
    hosting: local CPU (llama.cpp), €0
    provider: local
    model: ministral-3-3b-instruct-2512
    repo: mistralai/Ministral-3-3B-Instruct-2512-GGUF
