  # Scaleway Generative APIs, Paris; ids and EUR prices from
  # https://www.scaleway.com/en/pricing/model-as-a-service/ (read 2026-10-07). No training on
  # inputs (Scaleway data-privacy page). Run only when SCW_GENAI_SECRET_KEY is set.
  - id: mistral-small-3.2-scaleway
    publisher: Mistral AI (FR)
    licence: Apache-2.0
    licence_source: https://huggingface.co/mistralai/Mistral-Small-3.2-24B-Instruct-2506
    params: 24B
    hosting: Scaleway Generative APIs (Paris), pay per token
    provider: scaleway
    model: mistral-small-3.2-24b-instruct-2506
    price_eur_per_mtok: {in: 0.15, out: 0.35}

  - id: gemma-4-26b-a4b-scaleway
    publisher: Google (US)
    licence: Apache-2.0
    licence_source: https://huggingface.co/google/gemma-4-26B-A4B-it
    params: 25.2B total / 3.8B active (MoE)
    hosting: Scaleway Generative APIs (Paris), pay per token
    provider: scaleway
    model: gemma-4-26b-a4b-it
    price_eur_per_mtok: {in: 0.25, out: 0.50}
    extra:
      # reasoning off: thinking tokens are billed as output. Scaleway documents
      # `reasoning_effort` (none/low/medium/high) instead of chat_template_kwargs
      # (raw.githubusercontent.com/scaleway/docs-content/main/pages/generative-apis/
      # reference-content/supported-models.mdx, read 2026-10-07)
      reasoning_effort: none

